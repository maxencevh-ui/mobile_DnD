<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grimoire — Mage Companion</title>
<style>
:root{--bg:#090b12;--panel:#111522;--panel2:#171b2b;--line:#292f45;--text:#f2f3f7;--muted:#9299ad;--gold:#e9c46a;--violet:#9b7bff;--cyan:#61d8ff;--red:#ff6b7a;--green:#6ee7a0;--shadow:0 20px 60px #0008}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 20% 0%,#202042 0,#090b12 38%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:#0c0f18e8;backdrop-filter:blur(18px);display:flex;flex-direction:column}.brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}.sigil{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#2a2252,#121528);border:1px solid #51427f;box-shadow:0 0 35px #725cff33;font-size:23px}.brand b{font-size:17px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.nav{display:grid;gap:7px}.nav button{border:1px solid transparent;background:transparent;color:#aeb4c7;text-align:left;padding:11px 12px;border-radius:11px;display:flex;gap:10px;align-items:center}.nav button:hover,.nav button.active{background:#171b2b;border-color:#2c3350;color:white}.nav button.active{box-shadow:inset 3px 0 var(--violet)}.sideBottom{margin-top:auto}.mini{padding:12px;border:1px solid var(--line);border-radius:14px;background:#101421}.mini .bar{height:5px;background:#242a3d;border-radius:9px;overflow:hidden;margin-top:6px}.mini .bar i{display:block;height:100%;background:var(--violet);width:60%}.main{max-width:1500px;width:100%;margin:auto;padding:24px 30px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{font-size:28px;margin:0}.top p{color:var(--muted);margin:5px 0 0}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#151a29;color:#eef0f8;padding:10px 13px;border-radius:10px}.btn:hover{border-color:#4a5273;background:#1b2133}.btn.primary{background:linear-gradient(135deg,#7258df,#9b7bff);border-color:#9b7bff;color:white}.btn.danger{color:#ff9da7}.grid{display:grid;gap:16px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.card{background:linear-gradient(160deg,#131827e8,#0f1320e8);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.heroCard{min-height:220px;position:relative;overflow:hidden}.heroCard:after{content:'✦';position:absolute;right:35px;top:20px;font-size:150px;color:#9b7bff0d}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--gold);font-size:10px;font-weight:700}.name{font-family:Georgia,serif;font-size:42px;margin:8px 0 3px}.subtitle{color:#b7bdd0}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.chip{padding:6px 9px;border-radius:999px;background:#1a1f30;border:1px solid #2c3450;color:#c9cde0;font-size:12px}.resources{display:grid;gap:12px;margin-top:18px;max-width:520px}.res{display:grid;grid-template-columns:48px 1fr 70px;gap:10px;align-items:center}.res .icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#1b2030}.res .label{font-size:12px;color:var(--muted)}.res strong{display:block}.track{height:9px;background:#262b3c;border-radius:99px;overflow:hidden;margin-top:5px}.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),#d1bfff)}.track.hp i{background:linear-gradient(90deg,#ff5e70,#ff9aa5)}.res .num{text-align:right;font-weight:700}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{padding:14px;border:1px solid var(--line);background:#171b29;border-radius:13px;color:white;text-align:left}.quick button small{display:block;color:var(--muted);margin-top:3px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}.sectionTitle h2{font-size:16px;margin:0}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.spell{min-height:190px;display:flex;flex-direction:column}.spellTop{display:flex;gap:10px;align-items:center}.spellIcon{width:42px;height:42px;border-radius:12px;background:#201d36;display:grid;place-items:center;font-size:21px}.spell h3{margin:0;font-size:15px}.spell .meta{font-size:11px;color:var(--muted);margin-top:2px}.spell p{font-size:13px;color:#c4c8d7;line-height:1.45}.spell .bottom{margin-top:auto;display:flex;gap:8px}.spell .bottom button{flex:1}.tag{font-size:10px;padding:4px 7px;border-radius:99px;background:#20253a;color:#bfc6df}.warn{background:#251b22;border-color:#54313b}.good{background:#13231d;border-color:#244e3a}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#121725}.row b{font-size:13px}.row small{color:var(--muted)}.row .right{display:flex;gap:6px;align-items:center}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.form{display:grid;gap:10px}.form label{font-size:11px;color:var(--muted)}input,textarea,select{width:100%;background:#0d111c;color:white;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}input:focus,textarea:focus,select:focus{border-color:#6653ad}textarea{min-height:100px;resize:vertical}.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.statgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat{padding:12px;text-align:center;background:#121726;border:1px solid var(--line);border-radius:12px}.stat b{font-size:19px;display:block}.stat span{font-size:10px;color:var(--muted)}.dice{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.die{padding:18px 8px;border:1px solid var(--line);background:#151a28;border-radius:13px;color:white;font-weight:700}.rollResult{font-family:Georgia,serif;font-size:48px;text-align:center;padding:22px}.condition{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.dot.green{background:var(--green)}.empty{text-align:center;padding:35px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.hidden{display:none!important}.toast{position:fixed;right:22px;bottom:22px;background:#1b2132;border:1px solid #424b6b;padding:12px 15px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(15px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:sticky;height:auto;z-index:10;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}.brand{margin:0 0 8px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sideBottom{display:none}.main{padding:18px}.hero,.two{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.statgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.top{align-items:flex-start;gap:10px}.top .actions{display:none}.cards{grid-template-columns:1fr}.main{padding:14px}.name{font-size:34px}.quick{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}

/* Mobile/tablet UX pass */
html{min-width:0;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{min-width:0;overflow-x:hidden}
button,input,textarea,select{touch-action:manipulation}
@media (max-width: 1024px){
  .app{display:block;min-height:100svh}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;min-height:0;padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));border:0;border-top:1px solid var(--line);background:rgba(10,13,22,.96);backdrop-filter:blur(22px);z-index:100;box-shadow:0 -12px 35px #0008}
  .brand,.sideBottom{display:none}
  .nav{display:flex;gap:4px;width:100%;overflow-x:auto;scrollbar-width:none;justify-content:space-between}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:1 0 auto;min-width:74px;justify-content:center;flex-direction:column;gap:3px;padding:8px 7px;border-radius:12px;text-align:center;font-size:11px;line-height:1.1;min-height:52px}
  .nav button.active{box-shadow:inset 0 -2px var(--violet)}
  .main{max-width:none;padding:18px 18px calc(92px + env(safe-area-inset-bottom));margin:0}
  .top{position:sticky;top:0;z-index:20;margin: -18px -18px 16px;padding:14px 18px 12px;background:rgba(9,11,18,.90);backdrop-filter:blur(18px);border-bottom:1px solid rgba(41,47,69,.75)}
  .top h1{font-size:24px}
  .top p{font-size:12px}
  .top .actions{display:flex}
  .hero{grid-template-columns:1.15fr .85fr}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:1fr 1fr}
  .statgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table{min-width:520px}
}
@media (max-width: 700px){
  .main{padding:12px 12px calc(88px + env(safe-area-inset-bottom))}
  .top{margin:-12px -12px 14px;padding:12px 12px 10px}
  .top h1{font-size:21px}
  .top p{display:none}
  .top .actions .btn{font-size:0;padding:9px;width:40px;height:40px;display:grid;place-items:center}
  .top .actions .btn:first-child:before{content:'↥';font-size:18px}
  .top .actions .btn:nth-child(2):before{content:'↧';font-size:18px}
  .hero,.two{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .card{padding:14px;border-radius:15px;min-width:0}
  .heroCard{min-height:0}
  .name{font-size:30px;line-height:1.05;max-width:70%}
  .heroCard:after{right:-5px;top:12px;font-size:100px}
  .resources{max-width:none}
  .res{grid-template-columns:42px minmax(0,1fr) 58px;gap:8px}
  .res .icon{width:36px;height:36px}
  .quick{grid-template-columns:1fr 1fr}
  .quick button{min-height:64px;padding:12px;font-size:13px}
  .sectionTitle{margin:18px 0 9px}
  .sectionTitle h2{font-size:15px}
  .statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{padding:10px 8px}
  .dice{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .die{padding:14px 5px;min-height:52px}
  .spell{min-height:0}
  .spell .bottom{flex-direction:row}
  .spell .bottom .btn{min-height:44px}
  .btn{min-height:42px;padding:9px 11px}
  input,textarea,select{font-size:16px;min-height:44px}
  textarea{min-height:120px}
  .row{align-items:flex-start;padding:10px;gap:8px}
  .row .right{flex-wrap:wrap;justify-content:flex-end}
  .toast{left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));text-align:center}
}
@media (max-width: 390px){
  .nav button{min-width:62px;font-size:10px;padding:7px 5px}
  .nav button span{max-width:64px;overflow:hidden;text-overflow:ellipsis}
  .main{padding-left:10px;padding-right:10px}
  .top{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}
  .quick{grid-template-columns:1fr}
  .name{font-size:27px}
  .chips{gap:5px}
  .chip{font-size:11px;padding:5px 7px}
}
@media (min-width:701px) and (max-width:1024px){
  .main{padding-left:24px;padding-right:24px}
  .top{margin-left:-24px;margin-right:-24px;padding-left:24px;padding-right:24px}
  .hero{grid-template-columns:1.1fr .9fr}
}
</style></head>
<body>
<div class="app">
<aside class="side"><div class="brand"><div class="sigil">✦</div><div><b>GRIMOIRE</b><span>MAGE COMPANION</span></div></div>
<nav class="nav" id="nav"></nav><div class="sideBottom"><div class="mini"><div style="display:flex;justify-content:space-between"><span class="muted">Mana</span><b id="sideMana">—</b></div><div class="bar"><i id="sideManaBar"></i></div></div></div></aside>
<main class="main"><div class="top"><div><h1 id="pageTitle">Tableau de bord</h1><p id="pageSub">Ton état de jeu, en un coup d'œil.</p></div><div class="actions"><button class="btn" onclick="exportData()">↥ Exporter</button><button class="btn" onclick="document.getElementById('importFile').click()">↧ Importer</button><input id="importFile" class="hidden" type="file" accept="application/json" onchange="importData(event)"></div></div><div id="view"></div></main></div><div id="toast" class="toast"></div>
<script>
const KEY='grimoire_mage_v2';
const defaultState={character:{name:'Aelyr',class:'Mage',race:'Humain',level:7,hp:38,maxHp:45,mana:21,maxMana:32,xp:1840,gold:127,stats:{FOR:8,DEX:12,INT:18,SAG:15,CHA:11,CON:10},notes:'Rappeler au MJ que mon bâton est mon focus arcanique.'},spells:[{id:1,name:'Boule de feu',icon:'🔥',type:'Offensif',cost:5,range:'20 m',effect:'Projette une explosion ardente. Dégâts à préciser selon les règles de la table.',restriction:'Nécessite une ligne de vue.',fav:true},{id:2,name:'Bouclier arcanique',icon:'🛡️',type:'Réaction',cost:4,range:'Soi',effect:'Réduit ou annule une attaque selon la règle de votre table.',restriction:'À utiliser au moment indiqué par la règle.',fav:true},{id:3,name:'Téléportation',icon:'✦',type:'Mobilité',cost:8,range:'30 m',effect:'Déplacement instantané vers une zone visible.',restriction:'Vérifier les restrictions de terrain et de ligne de vue.',fav:false}],rules:[{id:1,title:'Armure',kind:'Restriction',text:'Ne pas porter une armure incompatible avec le lancement de sorts. Remplacer cette note par la règle exacte de votre système.'},{id:2,title:'Concentration',kind:'Règle',text:'Vérifier combien d’effets soutenus peuvent être maintenus simultanément.'},{id:3,title:'Composantes',kind:'Rappel',text:'Vérifier si le sort nécessite composante, geste, parole ou focus.'}],inventory:[{id:1,name:'Bâton de frêne',qty:1,desc:'Focus arcanique — exemple à confirmer.'},{id:2,name:'Potion de soin',qty:3,desc:'Usage en combat.'},{id:3,name:'Grimoire relié',qty:1,desc:'Contient les sorts préparés.'}],conditions:[],quests:[{id:1,name:'Le sanctuaire sous la brume',status:'En cours',note:'Retrouver la clef astrale.'}],log:[{time:'19:05',text:'Session ouverte.'},{time:'19:12',text:'+50 XP · récompense de scène.'}],notes:[{id:1,title:'À demander au MJ',text:'Clarifier les règles de concentration et de réaction.'}],settings:{theme:'dark'}};
let S=load(); let current='home';
function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(defaultState)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S));render();}
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
const pages={home:['⌂','Tableau de bord','Ton état de jeu, en un coup d’œil.'],grimoire:['✦','Grimoire','Sorts, coûts et restrictions.'],combat:['⚔','Combat','Actions, ressources, dés et conditions.'],character:['♙','Personnage','Ta fiche complète, toujours à jour.'],inventory:['♧','Inventaire','Objets, équipement et butin.'],journal:['☽','Journal','Sessions, quêtes et notes.'],rules:['⚠','Règles & rappels','Les choses que tu oublies toujours.']};
function nav(){document.getElementById('nav').innerHTML=Object.entries(pages).map(([k,v])=>`<button class="${current===k?'active':''}" onclick="go('${k}')"><span>${v[0]}</span>${v[1]}</button>`).join('')}
function go(k){current=k;render()}
function render(){nav();document.getElementById('pageTitle').textContent=pages[current][1];document.getElementById('pageSub').textContent=pages[current][2];document.getElementById('view').innerHTML=views[current]();document.getElementById('sideMana').textContent=`${S.character.mana}/${S.character.maxMana}`;document.getElementById('sideManaBar').style.width=(S.character.mana/S.character.maxMana*100)+'%'}
function resource(icon,label,val,max,cls){return `<div class="res"><div class="icon">${icon}</div><div><div class="label">${label}</div><strong>${val} / ${max}</strong><div class="track ${cls||''}"><i style="width:${Math.max(0,Math.min(100,val/max*100))}%"></i></div></div><div class="num">${Math.round(val/max*100)}%</div></div>`}
function spellCard(x){let ok=S.character.mana>=x.cost;return `<div class="card spell"><div class="spellTop"><div class="spellIcon">${x.icon}</div><div><h3>${esc(x.name)}</h3><div class="meta">${esc(x.type)} · ${esc(x.range)}</div></div></div><div style="margin-top:9px"><span class="tag">🔮 ${x.cost} mana</span> ${x.fav?'<span class="tag">★ Favori</span>':''}</div><p>${esc(x.effect)}</p><div class="card ${!ok?'warn':''}" style="padding:9px;margin-bottom:9px"><small>${ok?'✓ Disponible':'✕ Mana insuffisant'} · ${esc(x.restriction)}</small></div><div class="bottom"><button class="btn ${ok?'primary':''}" ${ok?'':'disabled'} onclick="cast(${x.id})">Lancer</button><button class="btn" onclick="toggleFav(${x.id})">${x.fav?'★':'☆'}</button></div></div>`}
const views={
home:()=>`<div class="hero"><div class="card heroCard"><div class="eyebrow">Chronique actuelle</div><div class="name">${esc(S.character.name)}</div><div class="subtitle">${esc(S.character.race)} · ${esc(S.character.class)} · Niveau ${S.character.level}</div><div class="chips"><span class="chip">⭐ ${S.character.xp} XP</span><span class="chip">🪙 ${S.character.gold} PO</span><span class="chip">📖 ${S.spells.length} sorts</span></div><div class="resources">${resource('❤️','Points de vie',S.character.hp,S.character.maxHp,'hp')}${resource('🔮','Mana',S.character.mana,S.character.maxMana)}</div></div><div class="card"><div class="eyebrow">Actions rapides</div><div class="quick" style="margin-top:12px"><button onclick="adjust('mana',-1)">−1 Mana<small>Coût rapide</small></button><button onclick="adjust('mana',1)">+1 Mana<small>Récupération</small></button><button onclick="adjust('hp',-1)">−1 PV<small>Dégâts</small></button><button onclick="adjust('hp',1)">+1 PV<small>Soin</small></button><button onclick="fullRestore()">☀ Repos<small>Récupérer les ressources</small></button><button onclick="rollD20()">🎲 Lancer d20<small>Test rapide</small></button></div></div></div>
<div class="sectionTitle"><h2>⚡ Tes sorts favoris</h2><button class="btn" onclick="go('grimoire')">Voir le grimoire</button></div><div class="cards">${S.spells.filter(x=>x.fav).slice(0,3).map(spellCard).join('')||'<div class="empty">Aucun sort favori.</div>'}</div>
<div class="two" style="margin-top:16px"><div class="card"><div class="sectionTitle" style="margin:0 0 10px"><h2>⚠ À retenir</h2><button class="btn" onclick="go('rules')">Toutes les règles</button></div><div class="list">${S.rules.slice(0,3).map(r=>`<div class="row"><div><b>${esc(r.title)}</b><br><small>${esc(r.text)}</small></div><span class="tag">${esc(r.kind)}</span></div>`).join('')}</div></div><div class="card"><div class="sectionTitle" style="margin:0 0 10px"><h2>☽ Derniers événements</h2><button class="btn" onclick="go('journal')">Journal</button></div><div class="list">${S.log.slice(-4).reverse().map(l=>`<div class="row"><small>${esc(l.time)}</small><b>${esc(l.text)}</b></div>`).join('')}</div></div></div>`,
grimoire:()=>`<div class="sectionTitle" style="margin-top:0"><h2>Sorts préparés</h2><button class="btn primary" onclick="addSpell()">＋ Nouveau sort</button></div><div class="cards">${S.spells.map(spellCard).join('')||'<div class="empty">Ton grimoire est vide.</div>'}</div>`,
combat:()=>`<div class="two"><div class="card"><div class="eyebrow">État de combat</div><div class="rollResult">${S.character.hp}<span class="muted" style="font-size:20px"> / ${S.character.maxHp} PV</span></div><div class="resources">${resource('❤️','PV',S.character.hp,S.character.maxHp,'hp')}${resource('🔮','Mana',S.character.mana,S.character.maxMana)}</div><div class="sectionTitle"><h2>Conditions actives</h2><button class="btn" onclick="addCondition()">＋</button></div><div class="list">${S.conditions.length?S.conditions.map((c,i)=>`<div class="row"><div class="condition"><span class="dot ${c.good?'green':''}"></span><b>${esc(c.name)}</b></div><button class="btn" onclick="removeCondition(${i})">×</button></div>`).join(''):'<div class="empty">Aucune condition active.</div>'}</div></div><div class="card"><div class="eyebrow">Laboratoire du hasard</div><div class="rollResult" id="rollResult">—</div><div class="dice">${[4,6,8,10,12,20,100].map(n=>`<button class="die" onclick="roll(${n})">d${n}</button>`).join('')}<button class="die" onclick="rollCustom()">d?</button></div><div class="sectionTitle"><h2>Dernier résultat</h2></div><p class="muted" id="rollHint">Choisis un dé.</p></div></div><div class="card" style="margin-top:16px"><div class="sectionTitle" style="margin:0 0 10px"><h2>Actions de combat</h2><button class="btn" onclick="go('grimoire')">Sorts</button></div><div class="cards">${S.spells.filter(s=>S.character.mana>=s.cost).map(spellCard).join('')}</div></div>`,
character:()=>`<div class="card"><div class="sectionTitle" style="margin:0 0 15px"><h2>Identité</h2><button class="btn primary" onclick="saveCharacter()">Enregistrer</button></div><div class="cols"><div class="form"><label>NOM</label><input id="c_name" value="${esc(S.character.name)}"><label>CLASSE</label><input id="c_class" value="${esc(S.character.class)}"><label>RACE / ORIGINE</label><input id="c_race" value="${esc(S.character.race)}"><label>NIVEAU</label><input id="c_level" type="number" value="${S.character.level}"></div><div class="form"><label>PV / PV MAX</label><div class="cols"><input id="c_hp" type="number" value="${S.character.hp}"><input id="c_maxhp" type="number" value="${S.character.maxHp}"></div><label>MANA / MANA MAX</label><div class="cols"><input id="c_mana" type="number" value="${S.character.mana}"><input id="c_maxmana" type="number" value="${S.character.maxMana}"></div><label>XP / OR</label><div class="cols"><input id="c_xp" type="number" value="${S.character.xp}"><input id="c_gold" type="number" value="${S.character.gold}"></div></div></div></div><div class="card" style="margin-top:16px"><div class="sectionTitle" style="margin:0 0 12px"><h2>Caractéristiques</h2></div><div class="statgrid">${Object.entries(S.character.stats).map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('')}</div><div class="form" style="margin-top:14px"><label>NOTES DU PERSONNAGE</label><textarea id="c_notes">${esc(S.character.notes)}</textarea></div></div>`,
inventory:()=>`<div class="sectionTitle" style="margin-top:0"><h2>Équipement & butin</h2><button class="btn primary" onclick="addItem()">＋ Ajouter</button></div><div class="list">${S.inventory.map((x,i)=>`<div class="row"><div><b>${esc(x.name)}</b><br><small>${esc(x.desc)} · Quantité ${x.qty}</small></div><div class="right"><button class="btn" onclick="qtyItem(${i},-1)">−</button><button class="btn" onclick="qtyItem(${i},1)">＋</button><button class="btn danger" onclick="delItem(${i})">×</button></div></div>`).join('')||'<div class="empty">Inventaire vide.</div>'}</div>`,
journal:()=>`<div class="two"><div class="card"><div class="sectionTitle" style="margin:0 0 10px"><h2>Quêtes</h2><button class="btn" onclick="addQuest()">＋</button></div><div class="list">${S.quests.map((q,i)=>`<div class="row"><div><b>${esc(q.name)}</b><br><small>${esc(q.note)}</small></div><select onchange="questStatus(${i},this.value)"><option ${q.status==='En cours'?'selected':''}>En cours</option><option ${q.status==='Terminée'?'selected':''}>Terminée</option><option ${q.status==='Abandonnée'?'selected':''}>Abandonnée</option></select></div>`).join('')}</div></div><div class="card"><div class="sectionTitle" style="margin:0 0 10px"><h2>Notes de session</h2><button class="btn" onclick="addNote()">＋</button></div><div class="list">${S.notes.map(n=>`<div class="row"><div><b>${esc(n.title)}</b><br><small>${esc(n.text)}</small></div></div>`).join('')}</div></div></div><div class="card" style="margin-top:16px"><div class="sectionTitle" style="margin:0 0 10px"><h2>Chronologie</h2><button class="btn danger" onclick="clearLog()">Vider</button></div><div class="tableWrap"><table class="table"><thead><tr><th>Heure</th><th>Événement</th></tr></thead><tbody>${S.log.slice().reverse().map(l=>`<tr><td>${esc(l.time)}</td><td>${esc(l.text)}</td></tr>`).join('')}</tbody></table></div>`,
rules:()=>`<div class="sectionTitle" style="margin-top:0"><h2>Ta mémoire externe</h2><button class="btn primary" onclick="addRule()">＋ Ajouter un rappel</button></div><div class="cards">${S.rules.map(r=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><span class="tag">${esc(r.kind)}</span><button class="btn danger" onclick="delRule(${r.id})">×</button></div><h3>${esc(r.title)}</h3><p class="muted" style="line-height:1.5">${esc(r.text)}</p></div>`).join('')}</div><div class="card" style="margin-top:16px"><div class="eyebrow">Philosophie du grimoire</div><h2 style="font-family:Georgia,serif">Ne mémorise plus. Consulte.</h2><p class="muted">Cette application est conçue comme une mémoire externe : les règles exactes de votre table doivent remplacer les exemples de démonstration.</p></div>`};
function adjust(k,n){S.character[k]=Math.max(0,Math.min(S.character['max'+k[0].toUpperCase()+k.slice(1)],S.character[k]+n));log(`${n>0?'+':''}${n} ${k==='hp'?'PV':'Mana'}`);save()}
function cast(id){let s=S.spells.find(x=>x.id===id);if(!s)return;if(S.character.mana<s.cost){toast('Mana insuffisant');return}S.character.mana-=s.cost;log(`−${s.cost} mana · ${s.name}`);save();toast(`${s.name} lancé`)}
function toggleFav(id){let s=S.spells.find(x=>x.id===id);s.fav=!s.fav;save()}
function fullRestore(){S.character.hp=S.character.maxHp;S.character.mana=S.character.maxMana;log('☀ Repos · PV et mana restaurés');save();toast('Ressources restaurées')}
function log(t){let d=new Date();S.log.push({time:d.toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'}),text:t});if(S.log.length>100)S.log.shift()}
function roll(n){let r=Math.floor(Math.random()*n)+1;document.getElementById('rollResult').textContent=r;document.getElementById('rollHint').textContent=`d${n} · ${new Date().toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'})}`;log(`🎲 d${n} → ${r}`);localStorage.setItem(KEY,JSON.stringify(S));toast(`d${n} → ${r}`)}
function rollD20(){if(current!=='combat')go('combat');setTimeout(()=>roll(20),20)}
function rollCustom(){let n=parseInt(prompt('Nombre de faces ?',20));if(n>1)roll(n)}
function addSpell(){let name=prompt('Nom du sort ?');if(!name)return;let cost=parseInt(prompt('Coût en mana ?',5))||0;let effect=prompt('Effet / description ?','À compléter avec la règle exacte.');let restriction=prompt('Restriction / condition ?','À vérifier avec les règles.');S.spells.push({id:Date.now(),name,icon:'✨',type:'Sort',cost,range:'—',effect,restriction,fav:false});save();toast('Sort ajouté')}
function addRule(){let title=prompt('Titre du rappel ?');if(!title)return;let text=prompt('Règle / restriction ?');if(!text)return;let kind=prompt('Type ?','Restriction');S.rules.push({id:Date.now(),title,text,kind});save()}
function delRule(id){S.rules=S.rules.filter(r=>r.id!==id);save()}
function addItem(){let name=prompt('Objet ?');if(!name)return;let qty=parseInt(prompt('Quantité ?',1))||1;let desc=prompt('Description ?','');S.inventory.push({id:Date.now(),name,qty,desc});save()}
function qtyItem(i,n){S.inventory[i].qty=Math.max(0,S.inventory[i].qty+n);save()}
function delItem(i){S.inventory.splice(i,1);save()}
function addCondition(){let name=prompt('Condition active ?');if(!name)return;S.conditions.push({name,good:false});save()}
function removeCondition(i){S.conditions.splice(i,1);save()}
function addQuest(){let name=prompt('Nom de la quête ?');if(!name)return;let note=prompt('Note ?','');S.quests.push({id:Date.now(),name,status:'En cours',note});save()}
function questStatus(i,v){S.quests[i].status=v;save()}
function addNote(){let title=prompt('Titre ?');if(!title)return;let text=prompt('Note ?','');S.notes.push({id:Date.now(),title,text});save()}
function clearLog(){if(confirm('Vider le journal ?')){S.log=[];save()}}
function saveCharacter(){let g=id=>document.getElementById(id);Object.assign(S.character,{name:g('c_name').value,class:g('c_class').value,race:g('c_race').value,level:+g('c_level').value,hp:+g('c_hp').value,maxHp:+g('c_maxhp').value,mana:+g('c_mana').value,maxMana:+g('c_maxmana').value,xp:+g('c_xp').value,gold:+g('c_gold').value,notes:g('c_notes').value});S.character.hp=Math.min(S.character.hp,S.character.maxHp);S.character.mana=Math.min(S.character.mana,S.character.maxMana);save();toast('Personnage enregistré')}
function exportData(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='grimoire-personnage.json';a.click();URL.revokeObjectURL(a.href);toast('Sauvegarde exportée')}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();toast('Sauvegarde importée')}catch{toast('Fichier invalide')}};r.readAsText(f)}
render();
</script></body></html>
